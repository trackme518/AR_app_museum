name: ar_museum

services:
  traefik:
    image: traefik:v3.5
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "/etc/traefik/ar-museum-entrypoint.sh"]
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./traefik-entrypoint.sh:/etc/traefik/ar-museum-entrypoint.sh:ro
      - ./certificates/server:/certs:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - frontend
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - uploads_data:/var/www/html/uploads
      - ./certificates/public:/var/www/html/certificates:ro
    networks:
      - frontend
      - backend
    restart: unless-stopped

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../help_files/setup_db.sql:/docker-entrypoint-initdb.d/001-setup.sql:ro
    networks:
      - backend
    restart: unless-stopped

volumes:
  mariadb_data:
  uploads_data:
  letsencrypt_data:

networks:
  frontend:
  backend:
    internal: true
