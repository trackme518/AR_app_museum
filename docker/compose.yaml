name: ar_museum

# Application stack: PHP app + MariaDB. TLS/routing lives in the edge stack
# (docker/edge/compose.yaml). Both stacks share the external "proxy" network:
#
#   docker network create proxy
#
services:
  app:
    image: ghcr.io/trackme518/ar_museum-app:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    labels:
      # Routing for an external label-driven Traefik (providers.docker=true,
      # exposedbydefault=false, e.g. deployed via a hosting panel). Ignored by
      # this repo's own edge stack (docker/edge), which uses a file provider.
      - "traefik.enable=true"
      - "traefik.http.routers.ar-museum.rule=Host(`${APP_HOSTNAME}`)"
      - "traefik.http.routers.ar-museum.entrypoints=websecure"
      - "traefik.http.routers.ar-museum.tls.certresolver=letsencrypt"
      - "traefik.http.services.ar-museum.loadbalancer.server.port=80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - uploads_data:/var/www/html/uploads
    networks:
      - proxy
      - backend
    restart: unless-stopped

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped

volumes:
  mariadb_data:
  uploads_data:

networks:
  proxy:
    external: true
  backend:
    internal: true
